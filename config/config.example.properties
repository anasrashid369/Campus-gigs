# Copy this file to config/config.properties and fill in your local values.
# config.properties is git-ignored and must never be committed.

# Address of the MySQL database (a JDBC URL; Hibernate uses it). The database "campus_gigs" is created by db/01_schema.sql.
db.url=jdbc:mysql://localhost:3306/campus_gigs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# A MySQL account with privileges on campus_gigs (do not use root).
db.user=your_mysql_user

# The password of that account. Keep your real value only in config.properties.
db.password=your_mysql_password
